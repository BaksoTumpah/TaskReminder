name: Build Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Baca versi
        id: ver
        run: |
          NAME=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2 | tr -d '\r')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Ganti nama jadi release.apk
        run: |
          cp app/build/outputs/apk/release/app-release.apk release.apk
          ls -lh release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: release.apk

      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Catatan Sekolah v${{ steps.ver.outputs.name }}
          files: release.apk
